<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 90vw;
        }
        .game-title {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        #gameCanvas {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .controls {
            margin: 20px 0;
            color: white;
        }
        .score-display {
            font-size: 1.8rem;
            margin: 15px 0;
            color: #ffeb3b;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .mobile-controls {
            display: none;
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            gap: 15px;
            margin: 20px auto;
            max-width: 300px;
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            .game-title {
                font-size: 2rem;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🐍 智能贪吃蛇</h1>
        <div class="score-display">得分: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <div class="control-buttons">
                <button class="control-btn" onclick="startGame()">开始游戏</button>
                <button class="control-btn" onclick="pauseGame()">暂停</button>
                <button class="control-btn" onclick="resetGame()">重新开始</button>
            </div>

            <div class="mobile-controls">
                <button class="control-btn" style="grid-area: up;" onclick="changeDirection('up')">↑</button>
                <button class="control-btn" style="grid-area: left;" onclick="changeDirection('left')">←</button>
                <button class="control-btn" style="grid-area: right;" onclick="changeDirection('right')">→</button>
                <button class="control-btn" style="grid-area: down;" onclick="changeDirection('down')">↓</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            gridSize: 20,
            initialSpeed: 150,
            minSpeed: 50,
            speedIncrement: 5
        };

        // 游戏状态
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameInterval;
        let score = 0;
        let isPaused = false;
        let gameStarted = false;
        let lastRenderTime = 0;
        let speed = config.initialSpeed;

        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // 初始化游戏
        function initGame() {
            // 初始化蛇身
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];

            // 生成食物
            generateFood();

            // 重置游戏状态
            score = 0;
            speed = config.initialSpeed;
            direction = 'right';
            nextDirection = 'right';
            isPaused = false;
            gameStarted = false;

            updateScore();
            draw();
        }

        // 生成食物
        function generateFood() {
            let newFood;
            let foodOnSnake;

            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * (canvas.width / config.gridSize)),
                    y: Math.floor(Math.random() * (canvas.height / config.gridSize))
                };

                // 检查食物是否在蛇身上
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);

            food = newFood;
        }

        // 游戏主循环
        function gameLoop(currentTime) {
            if (!gameStarted || isPaused) return;

            window.requestAnimationFrame(gameLoop);

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < 1 / (1000 / speed)) return;

            lastRenderTime = currentTime;

            update();
            draw();
        }

        // 更新游戏状态
        function update() {
            direction = nextDirection;

            // 计算新蛇头位置
            const head = {...snake[0]};
            switch (direction) {
                case 'up': head.y -= 1; break;
                case 'down': head.y += 1; break;
                case 'left': head.x -= 1; break;
                case 'right': head.x += 1; break;
            }

            // 边界检测
            if (head.x < 0 || head.x >= canvas.width / config.gridSize ||
                head.y < 0 || head.y >= canvas.height / config.gridSize) {
                gameOver();
                return;
            }

            // 自身碰撞检测
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            // 移动蛇
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 吃到食物，增加分数和速度
                score += 10;
                speed = Math.max(config.minSpeed, speed - config.speedIncrement);
                updateScore();
                generateFood();
            } else {
                // 没吃到食物，移除尾部
                snake.pop();
            }
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            drawGrid();

            // 绘制蛇
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#4CAF50' :
                    `hsl(${(index * 30) % 360}, 70%, 50%)`;

                ctx.fillRect(
                    segment.x * config.gridSize,
                    segment.y * config.gridSize,
                    config.gridSize - 1,
                    config.gridSize - 1
                );

                // 绘制蛇眼
                if (isHead) {
                    ctx.fillStyle = 'white';
                    const eyeSize = config.gridSize / 5;

                    // 根据方向调整眼睛位置
                    let leftEye = {x: 0, y: 0};
                    let rightEye = {x: 0, y: 0};

                    switch (direction) {
                        case 'right':
                            leftEye = {x: segment.x * config.gridSize + config.gridSize - eyeSize*2,
                                     y: segment.y * config.gridSize + eyeSize};
                            rightEye = {x: segment.x * config.gridSize + config.gridSize - eyeSize*2,
                                      y: segment.y * config.gridSize + config.gridSize - eyeSize*2};
                            break;
                        case 'left':
                            leftEye = {x: segment.x * config.gridSize + eyeSize,
                                     y: segment.y * config.gridSize + eyeSize};
                            rightEye = {x: segment.x * config.gridSize + eyeSize,
                                      y: segment.y * config.gridSize + config.gridSize - eyeSize*2};
                            break;
                        case 'up':
                            leftEye = {x: segment.x * config.gridSize + eyeSize,
                                     y: segment.y * config.gridSize + eyeSize};
                            rightEye = {x: segment.x * config.gridSize + config.gridSize - eyeSize*2,
                                      y: segment.y * config.gridSize + eyeSize};
                            break;
                        case 'down':
                            leftEye = {x: segment.x * config.gridSize + eyeSize,
                                     y: segment.y * config.gridSize + config.gridSize - eyeSize*2};
                            rightEye = {x: segment.x * config.gridSize + config.gridSize - eyeSize*2,
                                      y: segment.y * config.gridSize + config.gridSize - eyeSize*2};
                            break;
                    }

                    ctx.fillRect(leftEye.x, leftEye.y, eyeSize, eyeSize);
                    ctx.fillRect(rightEye.x, rightEye.y, eyeSize, eyeSize);
                }
            });

            // 绘制食物
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            const foodX = food.x * config.gridSize + config.gridSize / 2;
            const foodY = food.y * config.gridSize + config.gridSize / 2;
            const foodRadius = config.gridSize / 2 - 2;

            // 绘制旋转的星形食物
            ctx.save();
            ctx.translate(foodX, foodY);
            ctx.rotate(Date.now() / 1000);

            // 星形路径
            const spikes = 5;
            const outerRadius = foodRadius;
            const innerRadius = foodRadius / 2;

            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (Math.PI * i) / spikes;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();

            // 渐变填充
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, outerRadius);
            gradient.addColorStop(0, '#FFEB3B');
            gradient.addColorStop(1, '#FF9800');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;

            // 垂直线
            for (let x = 0; x <= canvas.width; x += config.gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 水平线
            for (let y = 0; y <= canvas.height; y += config.gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = score;
        }

        // 改变方向
        function changeDirection(newDirection) {
            // 防止反向移动
            if ((direction === 'up' && newDirection === 'down') ||
                (direction === 'down' && newDirection === 'up') ||
                (direction === 'left' && newDirection === 'right') ||
                (direction === 'right' && newDirection === 'left')) {
                return;
            }
            nextDirection = newDirection;
        }

        // 开始游戏
        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
                isPaused = false;
                window.requestAnimationFrame(gameLoop);
            } else if (isPaused) {
                isPaused = false;
                window.requestAnimationFrame(gameLoop);
            }
        }

        // 暂停游戏
        function pauseGame() {
            isPaused = true;
        }

        // 重新开始游戏
        function resetGame() {
            clearInterval(gameInterval);
            initGame();
            if (gameStarted) {
                startGame();
            }
        }

        // 游戏结束
        function gameOver() {
            gameStarted = false;
            isPaused = true;

            // 显示游戏结束信息
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 30);

            ctx.font = '20px Arial';
            ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
            ctx.fillText('点击重新开始按钮继续', canvas.width / 2, canvas.height / 2 + 50);
        }

        // 键盘控制
        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp': case 'w': case 'W':
                    changeDirection('up'); break;
                case 'ArrowDown': case 's': case 'S':
                    changeDirection('down'); break;
                case 'ArrowLeft': case 'a': case 'A':
                    changeDirection('left'); break;
                case 'ArrowRight': case 'd': case 'D':
                    changeDirection('right'); break;
                case ' ': // 空格键暂停
                    if (isPaused) startGame();
                    else pauseGame();
                    break;
            }
        });

        // 触摸控制
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (event) => {
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
            event.preventDefault();
        });

        canvas.addEventListener('touchmove', (event) => {
            if (!touchStartX || !touchStartY) return;

            const touchEndX = event.touches[0].clientX;
            const touchEndY = event.touches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                changeDirection(dx > 0 ? 'right' : 'left');
            } else {
                // 垂直滑动
                changeDirection(dy > 0 ? 'down' : 'up');
            }

            touchStartX = touchEndX;
            touchStartY = touchEndY;
            event.preventDefault();
        });

        // 窗口大小变化时调整画布
        window.addEventListener('resize', () => {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth - 60, 500);
            canvas.width = size;
            canvas.height = size;
            draw();
        });

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
