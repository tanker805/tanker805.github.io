<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f2">
  <title>英语练习室 · 专升本与四级</title>
  <style>
    :root{--green:#285d42;--ink:#183125;--muted:#73877a;--line:#dfe8dc;--paper:#fff;--bg:#f6f8f2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
    .wrap{width:min(100%,680px);margin:auto;padding:0 18px 72px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:white;font:bold 25px Georgia}.top small{font-size:11px;color:var(--muted);font-weight:500}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:800;color:#6b9775;margin-top:24px}h1{font-size:clamp(30px,7vw,42px);line-height:1.22;letter-spacing:-1px;margin:10px 0 10px}h1 span{color:#46845d}.intro{font-size:14px;color:var(--muted);margin:0 0 26px}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #eee1b8;border-radius:12px;color:#826939;font-size:12px;line-height:1.6;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px}.stat b{display:block;font-size:23px;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:9px;margin:18px 0 13px}.tab{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--green);font-size:13px;font-weight:700;padding:9px 15px}.tab.active{background:var(--green);border-color:var(--green);color:white}.card{background:#fff;border:1px solid var(--line);box-shadow:0 14px 45px #2d4a2b0b;border-radius:19px;padding:25px 22px;min-height:385px}.cardhead{display:flex;align-items:center;justify-content:space-between;color:#6c9676;font-size:11px;font-weight:800}.word{text-align:center;margin:30px 0 25px}.word h2{font:normal 58px Georgia,serif;letter-spacing:-2px;overflow-wrap:anywhere;margin:2px 0;color:#1d3828}.pos{display:inline-block;background:#edf5eb;border-radius:6px;padding:3px 9px;color:var(--green);font-size:12px;font-weight:800}.listen{border:0;background:#e7f3e8;color:var(--green);border-radius:9px;padding:7px 11px;margin-top:10px;font-size:12px}.label{display:block;color:#536d59;font-size:12px;font-weight:800;margin-bottom:9px}.answer{width:100%;height:50px;border:1.5px solid #dbe7da;border-radius:10px;padding:0 13px;outline:none}.answer:focus{border-color:#659b70}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.primary,.quiet{border-radius:10px;padding:12px 15px;font-size:13px;font-weight:800}.primary{border:1px solid var(--green);background:var(--green);color:#fff}.quiet{border:1px solid var(--line);background:white;color:var(--green)}.feedback{border-radius:12px;background:#f1f6ed;padding:15px;margin-top:18px}.feedback.wrong{background:#fff4ed}.feedback strong{display:block;font-size:15px}.feedback p{margin:8px 0;color:#576a5a;font-size:13px}.feedback .en{color:#284735;font-style:italic}.feedback .zh{color:#7b8c7e}.feedback .next{width:100%;margin-top:13px}.empty{text-align:center;padding:62px 10px;color:#778b7b}.empty strong{display:block;color:var(--green);font-size:19px;margin-bottom:8px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.tools button,.tools label{border:1px solid var(--line);background:white;color:var(--green);font-size:12px;border-radius:8px;padding:9px 12px;cursor:pointer}.tools input{display:none}.foot{font-size:11px;color:#96a699;line-height:1.7}.error{color:#b13f3f;font-size:12px;margin-top:10px}.hidden{display:none!important}@media(max-width:420px){.wrap{padding-left:15px;padding-right:15px}.stat{padding:12px 10px}.stat b{font-size:20px}.card{padding:20px 17px}.word h2{font-size:49px}.actions{align-items:stretch}.primary,.quiet{padding:11px 12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><div class="logo"><span class="mark">E.</span><div>英语练习室<br><small>WORD BY WORD</small></div></div><small>专升本 × 四级</small></header>
    <div class="eyebrow">YOUR DAILY PRACTICE</div>
    <h1>今天也<span>进步一点点。</span></h1>
    <p class="intro">看英文、听发音、写中文意思。答错的词会再出现。</p>
    <p class="notice">这是可在手机打开的本机版：学习记录保存在当前浏览器，暂未自动跨设备同步。换手机前请先导出备份。</p>
    <section class="stats" aria-label="学习统计"><div class="stat"><b id="today">0</b><span>今日练习 / 15</span></div><div class="stat"><b id="learned">0</b><span>已学单词</span></div><div class="stat"><b id="mastered">0</b><span>熟练掌握</span></div></section>
    <nav class="tabs" aria-label="练习模式"><button id="all" class="tab active" type="button">今日练习</button><button id="wrong" class="tab" type="button">错词复习</button></nav>
    <section class="card" aria-live="polite">
      <div id="quiz"><div class="cardhead"><span id="topic">核心词</span><span id="count">167 词词库</span></div><div class="word"><h2 id="word">…</h2><span id="pos" class="pos">v.</span><br><button class="listen" id="sayWord" type="button">🔊 听单词</button></div><form id="answerForm"><label class="label" for="answer">用中文写下你的理解</label><input class="answer" id="answer" placeholder="例如：提高、改善" autocomplete="off"><div class="actions"><button class="quiet" id="skip" type="button">不认识，看答案</button><button class="primary" type="submit">提交答案 →</button></div></form><div id="feedback" class="feedback hidden"><strong id="result"></strong><p>参考释义：<b id="meaning"></b></p><p class="en" id="example"></p><p class="zh" id="exampleZh"></p><button class="listen" id="sayExample" type="button">🔊 听例句</button><button class="primary next" id="next" type="button">下一个单词 →</button></div><p class="error hidden" id="voiceError"></p></div>
      <div id="empty" class="empty hidden"><strong id="emptyTitle">今天学完啦！</strong><span id="emptyBody">明天回来复习。</span></div>
    </section>
    <div class="tools"><button id="export" type="button">导出学习记录</button><label for="import">导入学习记录<input id="import" type="file" accept="application/json,.json"></label></div>
    <p class="foot">单词、例句和词性沿用你的英语练习室词库。朗读依赖手机浏览器的语音功能；浏览器清除网站数据会删除本机记录，请定期导出备份。</p>
  </div>
  <script src="./english-words.js"></script>
  <script>
  (()=>{
    const words=window.ENGLISH_WORDS||[];const key="zt-english-progress-v1";const $=id=>document.getElementById(id);
    let state={words:{},days:{}},mode="all",current=null,recent=[],answered=false;
    try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved&&typeof saved.words==="object"&&typeof saved.days==="object")state=saved}catch{}
    const day=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    const plus=(d,n)=>{const date=new Date(d+"T12:00:00Z");date.setUTCDate(date.getUTCDate()+n);return date.toISOString().slice(0,10)};
    const clean=s=>s.trim().toLowerCase().replace(/[\s，。；;、,.!！]/g,"");
    function save(){localStorage.setItem(key,JSON.stringify(state));stats()}
    function stats(){const t=state.days[day()]||{attempts:0};$("today").textContent=t.attempts;$("learned").textContent=Object.keys(state.words).length;$("mastered").textContent=Object.values(state.words).filter(p=>p.streak>=3).length}
    function pick(){const due=words.filter(w=>state.words[w.id]?.due<=day()&&(mode==="all"||state.words[w.id].streak===0));const fresh=mode==="all"?words.filter(w=>!state.words[w.id]):[];return [...due,...fresh].find(w=>!recent.includes(w.id))||[...due,...fresh][0]||null}
    function draw(){current=pick();answered=false;$("feedback").classList.add("hidden");$("answerForm").classList.remove("hidden");$("voiceError").classList.add("hidden");$("answer").value="";$("quiz").classList.toggle("hidden",!current);$("empty").classList.toggle("hidden",!!current);if(!current){$("emptyTitle").textContent=mode==="wrong"?"错词复习完啦！":"今天可以收工啦！";$("emptyBody").textContent=mode==="wrong"?"暂时没有待复习的错词。":"词库已完成，明天回来复习。";return}$("topic").textContent=current.topic;$("count").textContent=words.length+" 词词库";$("word").textContent=current.id;$("pos").textContent=current.pos||"词性"}
    function submit(skip){if(!current||answered)return;const input=$("answer").value;const normalized=clean(input);if(!skip&&!normalized)return;const correct=!skip&&normalized.length>=2&&current.accepts.some(a=>{const x=clean(a);return normalized===x||(x.length>=2&&normalized.includes(x))});const today=day(),prev=state.words[current.id];const streak=correct?(prev?.streak||0)+1:0;const interval=correct?[0,1,3,7,14,30,60][Math.min(streak,6)]:0;state.words[current.id]={attempts:(prev?.attempts||0)+1,correct:(prev?.correct||0)+(correct?1:0),streak,due:plus(today,interval),last:today};const t=state.days[today]||{attempts:0,correct:0,newWords:0};t.attempts++;t.correct+=correct?1:0;t.newWords+=prev?0:1;state.days[today]=t;save();answered=true;$("answerForm").classList.add("hidden");$("feedback").classList.remove("hidden");$("feedback").classList.toggle("wrong",!correct);$("result").textContent=correct?"答对了，很棒！":"记住它，下次再来。";$("meaning").textContent=current.meaning;$("example").textContent=current.example;$("exampleZh").textContent=current.exampleZh||""}
    function say(text){const err=$("voiceError");err.classList.add("hidden");if(!window.speechSynthesis){err.textContent="当前浏览器不支持语音朗读";err.classList.remove("hidden");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;u.onerror=()=>{err.textContent="朗读失败，请检查手机语音功能";err.classList.remove("hidden")};speechSynthesis.speak(u)}
    $("answerForm").addEventListener("submit",e=>{e.preventDefault();submit(false)});$("skip").onclick=()=>submit(true);$("next").onclick=()=>{recent=[current.id,...recent].slice(0,4);draw()};$("sayWord").onclick=()=>current&&say(current.id);$("sayExample").onclick=()=>current&&say(current.example);
    for(const kind of ["all","wrong"]){$(kind).onclick=()=>{mode=kind;recent=[];for(const k of ["all","wrong"])$(k).classList.toggle("active",k===kind);draw()}}
    $("export").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="英语学习记录-"+day()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
    $("import").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data.words!=="object"||!data.words||typeof data.days!=="object"||!data.days)throw Error();if(!confirm("导入会覆盖此浏览器当前的学习记录，确定继续吗？"))return;state={words:data.words,days:data.days};save();recent=[];draw();alert("学习记录已导入")}catch{alert("文件格式不正确，请选择本站导出的 JSON 备份")}finally{e.target.value=""}};
    stats();draw();
  })();
  </script>
</body>
</html>
